<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <!-- Sentry: catches page-load/browser-level failures that happen BEFORE Unity itself can
       start (wasm/data fetch failures, out-of-memory during the initial WebGL allocation,
       browser incompatibility) - Unity's own Sentry SDK (Assets/Resources/Sentry/
       SentryOptions.asset) can't see these since it only initializes once Unity is already
       running. Loaded first, before anything else, so it's active for the page's whole
       lifecycle. Same DSN/project as the in-game SDK, so both halves land in one unified
       issue stream in the Sentry dashboard. environment is tagged by hostname so staging
       and production reports aren't mixed together. -->
  <script
    src="https://browser.sentry-cdn.com/11.4.0/bundle.min.js"
    integrity="sha384-yR8WDlaM5tdf6UYPdUkCyZhW0OUuGNnKT8haW281Se9cj9eZP3z+iKwFvivogWnz"
    crossorigin="anonymous"
  ></script>
  <script>
    if (window.Sentry) {
      Sentry.init({
        dsn: "https://d14a436f8c966ec8c0374d5533a31632@o4512191277826048.ingest.us.sentry.io/4512191286280192",
        environment: /staging/i.test(location.hostname) ? "staging" : "production",
        release: "Fading City@1.3",
        // A refused pointer-lock request is harmless (the cursor just stays free until the next
        // click) - it was ~2,800 events a week drowning out real problems.
        ignoreErrors: [/pointer ?lock/i],
      });
      // The player from their last session (written by MobileDetect.jslib once /me succeeds),
      // so a failure before the game even starts - out of memory, broken download - still
      // says who it happened to. Replaced as soon as this session's login is confirmed.
      try {
        var savedUser = JSON.parse(localStorage.getItem("fc_sentry_user") || "null");
        if (savedUser && savedUser.id) Sentry.setUser(savedUser);
      } catch (e) {}
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Start loading assets right away, to have them (partly) loaded already when they are requested -->
  <link rel="preload" href="Build/Fading City_1.3.data.unityweb" as="fetch" type="application/octet-stream" crossorigin>
  <link rel="preload" href="Build/Fading City_1.3.framework.js.unityweb" as="script">
  <link rel="preload" href="Build/Fading City_1.3.wasm.unityweb" as="fetch" type="application/wasm" crossorigin>
  <title>Fading City</title>
  <style>
    * {
      padding: 0;
      margin: 0;
    }

    html {
      /* fix mobile viewport menu bar on iOS */
      height: -webkit-fill-available;
    }

    body {
      height: 100%;
      /* fix mobile viewport menu bar on iOS */
      height: -webkit-fill-available;
      width: 100%;
      text-align: center;
    }

    #unity-container {
      position: absolute;
      left: 0px;
      top: 0px;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Default values, might be overwritten by aspect ratio media queries */
    #unity-canvas {
      width: 100%;
      height: 100%;
      background-color: #fff;
    }



    #unity-loading-container {
      position: absolute;
      left: 0px;
      top: 0px;
      width: 100%;
      height: 100%;
      background-image: url('loading-bg.webp');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: min(4vh, 28px);
      padding: 3vh 4vw;
      box-sizing: border-box;

      opacity: 1;
      visibility: visible;
      transition: 800ms linear;
    }

    #unity-loading-container.finished {
      opacity: 0;
      visibility: collapse;
    }

    #unity-loading-container .logo-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #unity-loading-container .game-logo {
      width: auto;
      height: auto;
      max-width: min(42vw, 360px);
      max-height: 24vh;
      margin: 0 auto;
    }

    #unity-loading-container .brand-logo {
      width: auto;
      height: auto;
      max-width: min(16vw, 130px);
      max-height: 8vh;
    }

    #unity-loading-bar {
      position: relative;
      width: min(40vw, 420px);
      min-width: 200px;
      height: clamp(10px, 2.2vh, 18px);
      flex-shrink: 0;
      background-image: url('loading-bar-bg.webp');
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }

    #unity-loading-bar-inner {
      position: absolute;
      left: 0%;
      top: 0%;
      width: 100%;
      height: 100%;
      background-image: url('loading-bar-fg.webp');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      clip-path: inset(0 99% 0 0);
      transition: 400ms linear;
    }

    /* Rotate Device Overlay (portrait mobile) */
    #rotate-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1a1a2e;
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #rotate-overlay .icon {
      font-size: 60px;
      margin-bottom: 20px;
      animation: rotatePhone 2s ease-in-out infinite;
    }

    #rotate-overlay .msg {
      font-size: 18px;
      opacity: 0.8;
    }

    @keyframes rotatePhone {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    /* Same, for mobile devices index.html's script detects but the media query below misses
       ("Desktop site" mode lays the page out wider than 768px) */
    body.mobile-portrait #rotate-overlay {
      display: flex !important;
    }
    body.mobile-portrait #unity-container {
      display: none !important;
    }

    /* Show overlay only on portrait mobile */
    @media screen and (max-width: 768px) and (orientation: portrait) {
      #rotate-overlay {
        display: flex !important;
      }
      #unity-container {
        display: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- Rotate device overlay -->
  <div id="rotate-overlay">
    <div class="icon">&#x1F4F1;</div>
    <div class="msg">Please rotate your device to landscape mode</div>
  </div>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="unity-loading-container">
    <div class="logo-group">
      <img src="loading-logo.webp" class="game-logo" alt="Fading City">
      <img src="logo.svg" class="brand-logo" alt="Logo DefaultCompany">
    </div>
    <div id="unity-loading-bar">
      <div id="unity-loading-bar-inner"></div>
    </div>
  </div>
  <script src="Build/Fading City_1.3.loader.js"></script>
  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Fading City_1.3.loader.js";
    var config = {
      dataUrl: buildUrl + "/Fading City_1.3.data.unityweb",
      frameworkUrl: buildUrl + "/Fading City_1.3.framework.js.unityweb",
      codeUrl: buildUrl + "/Fading City_1.3.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Fading City",
      productVersion: "1.3",
      // Called by Unity's loader for uncaught runtime errors. Returning true stops its default
      // pop-up. A single audio clip the browser can't decode (EncodingError) is not worth stopping
      // the player with a blocking dialog - that clip just stays silent; it is logged instead.
      // Explicitly reported to Sentry too (not just relying on its own window.onerror hook) -
      // Unity's wasm runtime can route errors through here in a way the generic hook doesn't
      // always see, and this gives the report a clear "unity-runtime-error" tag to filter on.
      errorHandler: function (message, filename, lineno) {
        if (/EncodingError|Unable to decode audio data/i.test(String(message))) {
          console.warn("[Game] Audio clip could not be decoded - continuing without it: " + message);
          return true;
        }
        // The browser refusing pointer lock (no recent click, phone, Esc just pressed...) - the
        // game carries on with a visible cursor and locks on the next click. Was the blocking
        // pop-up ~1,000 players saw, and for some it came back on every tap.
        if (/pointer ?lock/i.test(String(message))) {
          console.warn("[Game] Pointer lock refused by the browser - ignored: " + message);
          return true;
        }
        if (window.Sentry) {
          Sentry.captureMessage("Unity runtime error: " + message, {
            level: "error",
            tags: { source: "unity-runtime-error" },
            extra: { filename: filename, lineno: lineno },
          });
        }
        return false;
      },
    };

    // Same rule as IsMobileBrowser in Assets/Plugins/WebGL/MobileDetect.jslib - keep in step.
    // The user agent alone misses phones in "Desktop site" mode (they report a desktop UA), so a
    // device whose only pointer is a finger counts too; iPadOS reports "Macintosh" + touch.
    function detectMobile() {
      var ua = navigator.userAgent;
      if (/iPhone|iPad|iPod|Android/i.test(ua)) return true;
      var touchPoints = navigator.maxTouchPoints || 0;
      if (/Macintosh/i.test(ua) && touchPoints > 1) return true;
      return touchPoints > 0 && !!window.matchMedia &&
        window.matchMedia("(pointer: coarse)").matches &&
        !window.matchMedia("(any-pointer: fine)").matches;
    }
    var isMobile = detectMobile();

    // Largest canvas the GPU can render to. "Desktop site" phones lay out a ~980px-wide page at
    // a ~3x pixel ratio, asking for a 4297px-high canvas on GPUs that stop at 4096 - Unity's
    // RenderTexture creation then failed every frame and the screen came out broken.
    // The same throwaway context also reads the GPU's name for the Sentry device details below.
    function probeGpu() {
      var result = { maxSize: 4096, renderer: "unknown", webgl: "none" };
      try {
        var probe = document.createElement("canvas");
        var gl = probe.getContext("webgl2");
        result.webgl = gl ? "2" : "none";
        if (!gl) {
          gl = probe.getContext("webgl");
          if (gl) result.webgl = "1";
        }
        if (gl) {
          var size = Math.min(gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), gl.getParameter(gl.MAX_TEXTURE_SIZE));
          if (size > 0) result.maxSize = size;
          var debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
          result.renderer = String(gl.getParameter(debugInfo ? debugInfo.UNMASKED_RENDERER_WEBGL : gl.RENDERER) || "unknown");
          var lose = gl.getExtension("WEBGL_lose_context");
          if (lose) lose.loseContext();
        }
      } catch (e) {}
      return result;
    }
    var gpuInfo = probeGpu();

    // 1.5 on mobile, not 2.0+: ~44% fewer pixels to shade every frame - a big part of keeping
    // phones from running hot over long sessions, and hard to tell apart on a phone-sized
    // screen. Then, on every device, never more than the GPU can draw: measured against the
    // longest side the page can ever get (screen or window, either orientation), with a little
    // margin, since this is fixed once at startup and the window can rotate/resize later.
    var pixelRatio = window.devicePixelRatio || 1;
    if (isMobile) {
      var maxPixelRatioMobile = 1.5;
      pixelRatio = Math.min(pixelRatio, maxPixelRatioMobile);
    }
    var longestSide = Math.max(screen.width || 0, screen.height || 0, window.innerWidth, window.innerHeight,
      document.documentElement.clientWidth || 0, document.documentElement.clientHeight || 0);
    if (longestSide > 0) {
      pixelRatio = Math.min(pixelRatio, (gpuInfo.maxSize * 0.95) / longestSide);
    }
    config.devicePixelRatio = pixelRatio;

    // Device details for Sentry, so a player's report shows what they were actually playing on.
    // Sentry's own detection can't tell: Chrome hides the phone model in its user agent (every
    // Android phone reads as "Android 10; K"), and Unity's SDK reports the game's own memory as
    // the device's. Collected once; the browser SDK gets them as searchable tags (e.g.
    // phone_model:SM-A146B, ram_gb:2) plus a "Device details" panel, and the game reads
    // window.fcDeviceInfo (Assets/Plugins/WebGL/MobileDetect.jslib) to put the same tags on
    // in-game errors. Device facts only - nothing that identifies the person.
    //   phone_model / os_version: Chrome, Edge, Samsung Internet only (Client Hints, asked for
    //     below). Safari never gives the model - an iPhone stays "iPhone".
    //   ram_gb: Chrome/Edge only, rounded and capped at 8 by the browser.
    window.fcDeviceInfo = {
      device_class: isMobile ? "mobile" : "desktop",
      phone_model: /iPhone/i.test(navigator.userAgent) ? "iPhone" : (/iPad/i.test(navigator.userAgent) ? "iPad" : (isMobile ? "unknown" : "desktop")),
      os_version: "unknown",
      ram_gb: navigator.deviceMemory ? String(navigator.deviceMemory) : "unknown",
      cpu_cores: navigator.hardwareConcurrency ? String(navigator.hardwareConcurrency) : "unknown",
      screen: (screen.width || 0) + "x" + (screen.height || 0) + "@" + (Math.round((window.devicePixelRatio || 1) * 100) / 100),
      canvas_dpr: String(Math.round(pixelRatio * 100) / 100),
      gpu: gpuInfo.renderer.slice(0, 190),
      gpu_max_texture: String(gpuInfo.maxSize),
      webgl: gpuInfo.webgl,
      network: "unknown",
      storage_free_mb: "unknown"
    };

    function reportDeviceInfo() {
      if (!window.Sentry) return;
      try {
        Sentry.setTags(window.fcDeviceInfo);
        Sentry.setContext("Device details", window.fcDeviceInfo);
      } catch (e) {}
    }

    try {
      var connection = navigator.connection;
      if (connection && connection.effectiveType) {
        window.fcDeviceInfo.network = connection.effectiveType + (connection.downlink ? " " + connection.downlink + "Mbps" : "");
      }
    } catch (e) {}
    reportDeviceInfo();

    // The asynchronous ones - each fills in its value and re-reports when it arrives (well
    // under a second, long before the game itself has loaded).
    try {
      if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
        navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"]).then(function (hints) {
          if (hints.model) window.fcDeviceInfo.phone_model = String(hints.model).slice(0, 100);
          if (hints.platform || hints.platformVersion) {
            window.fcDeviceInfo.os_version = ((hints.platform || "") + " " + (hints.platformVersion || "")).trim();
          }
          reportDeviceInfo();
        }).catch(function () {});
      }
    } catch (e) {}
    try {
      if (navigator.storage && navigator.storage.estimate) {
        navigator.storage.estimate().then(function (estimate) {
          if (estimate && estimate.quota) {
            window.fcDeviceInfo.storage_free_mb = String(Math.round((estimate.quota - (estimate.usage || 0)) / 1048576));
          }
          reportDeviceInfo();
        }).catch(function () {});
      }
    } catch (e) {}

    // The rotate-to-landscape overlay's CSS rule only matches pages narrower than 768px, which a
    // "Desktop site" phone (~980px wide) never is - so it's also switched on from here for any
    // device detected as mobile and held upright.
    function updateRotateOverlay() {
      document.body.classList.toggle("mobile-portrait", isMobile && window.innerHeight > window.innerWidth);
    }
    updateRotateOverlay();
    window.addEventListener("resize", updateRotateOverlay);
    window.addEventListener("orientationchange", updateRotateOverlay);

    var canvas = document.querySelector("#unity-canvas");
    var loadingContainer = document.querySelector("#unity-loading-container");
    var loadingBar = document.querySelector("#unity-loading-bar-inner");

    var unityGame;
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function() {
      createUnityInstance(canvas, config, function(progress) {
        loadingBar.style.clipPath = "inset(0 " + (100 - 100 * progress) + "% 0 0)";
      }).then(function(unityInstance) {
        unityGame = unityInstance;
        window.unityGameInstance = unityInstance;
        loadingContainer.classList.add("finished");
      }).catch(function(message) {
        // The single most important failure point for "what happened before Unity even
        // started" - createUnityInstance itself failed (wasm compile error, out-of-memory on
        // the initial allocation, browser incompatibility...). Reported explicitly with its
        // own tag so these are easy to find/filter in the Sentry dashboard separately from
        // in-game errors.
        if (window.Sentry) {
          Sentry.captureMessage("Unity failed to start: " + message, {
            level: "fatal",
            tags: { source: "unity-startup-failure" },
          });
        }
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
  <!-- Parse Unity rich text to render stylized browser console logs -->
  <script src="./pretty-console.js"></script>
</body>

</html>
