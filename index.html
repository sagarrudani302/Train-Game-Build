<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Start loading assets right away, to have them (partly) loaded already when they are requested -->
  <link rel="preload" href="Build/Color_3D_Build_Webgl_0.4.data.unityweb" as="fetch" type="application/octet-stream" crossorigin>
  <link rel="preload" href="Build/Color_3D_Build_Webgl_0.4.framework.js.unityweb" as="script">
  <link rel="preload" href="Build/Color_3D_Build_Webgl_0.4.wasm.unityweb" as="fetch" type="application/wasm" crossorigin>
  <title>Paint Game</title>
  <style>
    * {
      padding: 0;
      margin: 0;
    }

    html {
      /* fix mobile viewport menu bar on iOS */
      height: -webkit-fill-available;
    }

    body {
      height: 100%;
      /* fix mobile viewport menu bar on iOS */
      height: -webkit-fill-available;
      width: 100%;
      text-align: center;
    }

    #unity-container {
      position: absolute;
      left: 0px;
      top: 0px;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Default values, might be overwritten by aspect ratio media queries */
    #unity-canvas {
      width: 100%;
      height: 100%;
      background-color: #fff;
    }



    #unity-loading-container {
      position: absolute;
      left: 0px;
      top: 0px;
      width: 100%;
      height: 100%;
      background-image: url('loading-bg.webp');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: min(4vh, 28px);
      padding: 3vh 4vw;
      box-sizing: border-box;

      opacity: 1;
      visibility: visible;
      transition: 800ms linear;
    }

    #unity-loading-container.finished {
      opacity: 0;
      visibility: collapse;
    }

    #unity-loading-container .logo-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #unity-loading-container .game-logo {
      width: auto;
      height: auto;
      max-width: min(42vw, 360px);
      max-height: 24vh;
      margin: 0 auto;
    }

    #unity-loading-container .brand-logo {
      width: auto;
      height: auto;
      max-width: min(16vw, 130px);
      max-height: 8vh;
    }

    #unity-loading-bar {
      position: relative;
      width: min(40vw, 420px);
      min-width: 200px;
      height: clamp(10px, 2.2vh, 18px);
      flex-shrink: 0;
      background-image: url('loading-bar-bg.webp');
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }

    #unity-loading-bar-inner {
      position: absolute;
      left: 0%;
      top: 0%;
      width: 100%;
      height: 100%;
      background-image: url('loading-bar-fg.webp');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      clip-path: inset(0 99% 0 0);
      transition: 400ms linear;
    }

    /* Rotate Device Overlay (portrait mobile) */
    #rotate-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1a1a2e;
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #rotate-overlay .icon {
      font-size: 60px;
      margin-bottom: 20px;
      animation: rotatePhone 2s ease-in-out infinite;
    }

    #rotate-overlay .msg {
      font-size: 18px;
      opacity: 0.8;
    }

    @keyframes rotatePhone {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    /* Show overlay only on portrait mobile */
    @media screen and (max-width: 768px) and (orientation: portrait) {
      #rotate-overlay {
        display: flex !important;
      }
      #unity-container {
        display: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- Rotate device overlay -->
  <div id="rotate-overlay">
    <div class="icon">&#x1F4F1;</div>
    <div class="msg">Please rotate your device to landscape mode</div>
  </div>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="unity-loading-container">
    <div class="logo-group">
      <img src="loading-logo.webp" class="game-logo" alt="Paint Game">
      <img src="logo.svg" class="brand-logo" alt="Logo DefaultCompany">
    </div>
    <div id="unity-loading-bar">
      <div id="unity-loading-bar-inner"></div>
    </div>
  </div>
  <script src="Build/Color_3D_Build_Webgl_0.4.loader.js"></script>
  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Color_3D_Build_Webgl_0.4.loader.js";
    var config = {
      dataUrl: buildUrl + "/Color_3D_Build_Webgl_0.4.data.unityweb",
      frameworkUrl: buildUrl + "/Color_3D_Build_Webgl_0.4.framework.js.unityweb",
      codeUrl: buildUrl + "/Color_3D_Build_Webgl_0.4.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Paint Game",
      productVersion: "0.1",
    };

    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if(isMobile) {
      var maxPixelRatioMobile = 2.0;
      config.devicePixelRatio = Math.min(window.devicePixelRatio, maxPixelRatioMobile);
    }

    var canvas = document.querySelector("#unity-canvas");
    var loadingContainer = document.querySelector("#unity-loading-container");
    var loadingBar = document.querySelector("#unity-loading-bar-inner");

    var unityGame;
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function() {
      createUnityInstance(canvas, config, function(progress) {
        loadingBar.style.clipPath = "inset(0 " + (100 - 100 * progress) + "% 0 0)";
      }).then(function(unityInstance) {
        unityGame = unityInstance;
        window.unityGameInstance = unityInstance;
        loadingContainer.classList.add("finished");
      }).catch(function(message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
  <!-- Parse Unity rich text to render stylized browser console logs -->
  <script src="./pretty-console.js"></script>
</body>

</html>
