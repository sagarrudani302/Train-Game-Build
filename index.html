<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Train Game</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
      /* ── Rotate Device Overlay (portrait mobile) ── */
      #rotate-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #1a1a2e;
        z-index: 9999;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      #rotate-overlay .icon {
        font-size: 60px;
        margin-bottom: 20px;
        animation: rotatePhone 2s ease-in-out infinite;
      }
      #rotate-overlay .msg {
        font-size: 18px;
        opacity: 0.8;
      }
      @keyframes rotatePhone {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(90deg); }
      }

      /* Show overlay only on portrait mobile */
      @media screen and (max-width: 768px) and (orientation: portrait) {
        #rotate-overlay { display: flex !important; }
        #unity-container { display: none !important; }
      }
    </style>
  </head>
  <body>
    <!-- Rotate device overlay -->
    <div id="rotate-overlay">
      <div class="icon">📱</div>
      <div class="msg">Please rotate your device to landscape mode</div>
    </div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Train Game</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Train_Build_6.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Train_Build_6.data.unityweb",
        frameworkUrl: buildUrl + "/Train_Build_6.framework.js.unityweb",
        codeUrl: buildUrl + "/Train_Build_6.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Train Game",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        // Desktop style
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };

          // ── Fullscreen on first tap (mobile) ──
          // Enters fullscreen + locks landscape on the first user interaction
          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            canvas.addEventListener('click', function goFullscreen() {
              var elem = document.documentElement;
              if (elem.requestFullscreen) {
                elem.requestFullscreen().then(function() {
                  // Try to lock landscape once in fullscreen
                  if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock("landscape").catch(function() {});
                  }
                }).catch(function() {});
              } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen(); // Safari
              }
              canvas.removeEventListener('click', goFullscreen);
            }, { once: true });
          }

        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
