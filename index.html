<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <!-- Sentry: catches page-load/browser-level failures that happen BEFORE Unity itself can
       start (wasm/data fetch failures, out-of-memory during the initial WebGL allocation,
       browser incompatibility) - Unity's own Sentry SDK (Assets/Resources/Sentry/
       SentryOptions.asset) can't see these since it only initializes once Unity is already
       running. Loaded first, before anything else, so it's active for the page's whole
       lifecycle. Same DSN/project as the in-game SDK, so both halves land in one unified
       issue stream in the Sentry dashboard. environment is tagged by hostname so staging
       and production reports aren't mixed together. -->
  <script
    src="https://browser.sentry-cdn.com/11.4.0/bundle.min.js"
    integrity="sha384-yR8WDlaM5tdf6UYPdUkCyZhW0OUuGNnKT8haW281Se9cj9eZP3z+iKwFvivogWnz"
    crossorigin="anonymous"
  ></script>
  <script>
    if (window.Sentry) {
      Sentry.init({
        dsn: "https://d14a436f8c966ec8c0374d5533a31632@o4512191277826048.ingest.us.sentry.io/4512191286280192",
        environment: /staging/i.test(location.hostname) ? "staging" : "production",
        release: "Fading City@0.3",
      });
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Start loading assets right away, to have them (partly) loaded already when they are requested -->
  <link rel="preload" href="Build/Fading City_0.9.data.unityweb" as="fetch" type="application/octet-stream" crossorigin>
  <link rel="preload" href="Build/Fading City_0.9.framework.js.unityweb" as="script">
  <link rel="preload" href="Build/Fading City_0.9.wasm.unityweb" as="fetch" type="application/wasm" crossorigin>
  <title>Fading City</title>
  <style>
    * {
      padding: 0;
      margin: 0;
    }

    html {
      /* fix mobile viewport menu bar on iOS */
      height: -webkit-fill-available;
    }

    body {
      height: 100%;
      /* fix mobile viewport menu bar on iOS */
      height: -webkit-fill-available;
      width: 100%;
      text-align: center;
    }

    #unity-container {
      position: absolute;
      left: 0px;
      top: 0px;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Default values, might be overwritten by aspect ratio media queries */
    #unity-canvas {
      width: 100%;
      height: 100%;
      background-color: #fff;
    }



    #unity-loading-container {
      position: absolute;
      left: 0px;
      top: 0px;
      width: 100%;
      height: 100%;
      background-image: url('loading-bg.webp');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: min(4vh, 28px);
      padding: 3vh 4vw;
      box-sizing: border-box;

      opacity: 1;
      visibility: visible;
      transition: 800ms linear;
    }

    #unity-loading-container.finished {
      opacity: 0;
      visibility: collapse;
    }

    #unity-loading-container .logo-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #unity-loading-container .game-logo {
      width: auto;
      height: auto;
      max-width: min(42vw, 360px);
      max-height: 24vh;
      margin: 0 auto;
    }

    #unity-loading-container .brand-logo {
      width: auto;
      height: auto;
      max-width: min(16vw, 130px);
      max-height: 8vh;
    }

    #unity-loading-bar {
      position: relative;
      width: min(40vw, 420px);
      min-width: 200px;
      height: clamp(10px, 2.2vh, 18px);
      flex-shrink: 0;
      background-image: url('loading-bar-bg.webp');
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }

    #unity-loading-bar-inner {
      position: absolute;
      left: 0%;
      top: 0%;
      width: 100%;
      height: 100%;
      background-image: url('loading-bar-fg.webp');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      clip-path: inset(0 99% 0 0);
      transition: 400ms linear;
    }

    /* Rotate Device Overlay (portrait mobile) */
    #rotate-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1a1a2e;
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #rotate-overlay .icon {
      font-size: 60px;
      margin-bottom: 20px;
      animation: rotatePhone 2s ease-in-out infinite;
    }

    #rotate-overlay .msg {
      font-size: 18px;
      opacity: 0.8;
    }

    @keyframes rotatePhone {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    /* Show overlay only on portrait mobile */
    @media screen and (max-width: 768px) and (orientation: portrait) {
      #rotate-overlay {
        display: flex !important;
      }
      #unity-container {
        display: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- Rotate device overlay -->
  <div id="rotate-overlay">
    <div class="icon">&#x1F4F1;</div>
    <div class="msg">Please rotate your device to landscape mode</div>
  </div>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="unity-loading-container">
    <div class="logo-group">
      <img src="loading-logo.webp" class="game-logo" alt="Fading City">
      <img src="logo.svg" class="brand-logo" alt="Logo DefaultCompany">
    </div>
    <div id="unity-loading-bar">
      <div id="unity-loading-bar-inner"></div>
    </div>
  </div>
  <script src="Build/Fading City_0.9.loader.js"></script>
  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Fading City_0.9.loader.js";
    var config = {
      dataUrl: buildUrl + "/Fading City_0.9.data.unityweb",
      frameworkUrl: buildUrl + "/Fading City_0.9.framework.js.unityweb",
      codeUrl: buildUrl + "/Fading City_0.9.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Fading City",
      productVersion: "0.3",
      // Called by Unity's loader for uncaught runtime errors. Returning true stops its default
      // pop-up. A single audio clip the browser can't decode (EncodingError) is not worth stopping
      // the player with a blocking dialog - that clip just stays silent; it is logged instead.
      // Explicitly reported to Sentry too (not just relying on its own window.onerror hook) -
      // Unity's wasm runtime can route errors through here in a way the generic hook doesn't
      // always see, and this gives the report a clear "unity-runtime-error" tag to filter on.
      errorHandler: function (message, filename, lineno) {
        if (/EncodingError|Unable to decode audio data/i.test(String(message))) {
          console.warn("[Game] Audio clip could not be decoded - continuing without it: " + message);
          return true;
        }
        if (window.Sentry) {
          Sentry.captureMessage("Unity runtime error: " + message, {
            level: "error",
            tags: { source: "unity-runtime-error" },
            extra: { filename: filename, lineno: lineno },
          });
        }
        return false;
      },
    };

    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if(isMobile) {
      var maxPixelRatioMobile = 2.0;
      config.devicePixelRatio = Math.min(window.devicePixelRatio, maxPixelRatioMobile);
    }

    var canvas = document.querySelector("#unity-canvas");
    var loadingContainer = document.querySelector("#unity-loading-container");
    var loadingBar = document.querySelector("#unity-loading-bar-inner");

    var unityGame;
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function() {
      createUnityInstance(canvas, config, function(progress) {
        loadingBar.style.clipPath = "inset(0 " + (100 - 100 * progress) + "% 0 0)";
      }).then(function(unityInstance) {
        unityGame = unityInstance;
        window.unityGameInstance = unityInstance;
        loadingContainer.classList.add("finished");
      }).catch(function(message) {
        // The single most important failure point for "what happened before Unity even
        // started" - createUnityInstance itself failed (wasm compile error, out-of-memory on
        // the initial allocation, browser incompatibility...). Reported explicitly with its
        // own tag so these are easy to find/filter in the Sentry dashboard separately from
        // in-game errors.
        if (window.Sentry) {
          Sentry.captureMessage("Unity failed to start: " + message, {
            level: "fatal",
            tags: { source: "unity-startup-failure" },
          });
        }
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
  <!-- Parse Unity rich text to render stylized browser console logs -->
  <script src="./pretty-console.js"></script>
</body>

</html>
